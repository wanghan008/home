name = "home"
main = "worker/index.js"
compatibility_date = "2026-11-26"

# 保留在 Cloudflare 控制台中配置的变量，并声明部署必须继承的密钥。
keep_vars = true

[secrets]
required = ["ADMIN_PASSWORD", "SESSION_SECRET"]

# 整个自定义域名由 Worker 提供，与 workers.dev 使用同一套 dist 静态资源。
routes = [
  { pattern = "ta.whan.ipv64.de/*", zone_name = "ipv64.de" }
]

[[d1_databases]]
binding = "DB"
database_name = "home-blog"
database_id = "6622caad-e8f4-4461-860d-87e3e892552b"
migrations_dir = "migrations"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
